openapi: 3.0.3
info:
  title: SIPUS-Del Library RESTful Web API
  version: 1.0.0
  description: >
    Kontrak resmi layanan REST API Sistem Informasi Perpustakaan Kampus Del
    (Minggu 9 PPW). Mematuhi Richardson Maturity Model Level 3 (HATEOAS),
    autentikasi stateless Sanctum Bearer Token, transaksi sirkulasi ACID
    (DB::transaction + lockForUpdate), dan galat berformat RFC 7807.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server
tags:
  - name: Auth
    description: Penerbitan dan pencabutan Bearer Token
  - name: Buku
    description: Katalog buku (baca publik, mutasi wajib token)
  - name: Peminjaman
    description: Sirkulasi peminjaman dan pengembalian (wajib token)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token hasil POST /auth/login, dikirim pada header Authorization.

  schemas:
    Link:
      type: object
      properties:
        href: { type: string, example: "http://localhost:8000/api/v1/bukus/1" }
        method: { type: string, example: GET }
    Kategori:
      type: object
      properties:
        id: { type: integer, example: 1 }
        kode_kategori: { type: string, example: PRG }
        nama_kategori: { type: string, example: Pemrograman }
    Buku:
      type: object
      properties:
        id: { type: integer, example: 1 }
        isbn: { type: string, example: "9780132350884" }
        judul: { type: string, example: Clean Code }
        penulis: { type: string, example: Robert C. Martin }
        penerbit: { type: string, example: Prentice Hall }
        tahun_terbit: { type: integer, example: 2008 }
        stok: { type: integer, example: 5 }
        status_label: { type: string, enum: [TERSEDIA, HABIS] }
        sinopsis: { type: string, nullable: true }
        jumlah_peminjaman: { type: integer, example: 3 }
        kategori: { $ref: '#/components/schemas/Kategori' }
        riwayat_peminjaman:
          type: array
          items: { $ref: '#/components/schemas/Peminjaman' }
        updated_at: { type: string, format: date-time }
        _links:
          type: object
          description: >
            Kontrol hypermedia. Link pinjam_buku hanya muncul bila stok lebih dari 0.
          additionalProperties: { $ref: '#/components/schemas/Link' }
    BukuInput:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, kategori_id, stok]
      properties:
        isbn: { type: string, minLength: 10, maxLength: 13, example: "9780132350884" }
        judul: { type: string, minLength: 5, maxLength: 200, example: Clean Code }
        penulis: { type: string, maxLength: 150, example: Robert C. Martin }
        penerbit: { type: string, maxLength: 100, example: Prentice Hall }
        tahun_terbit: { type: integer, minimum: 1900, example: 2008 }
        kategori_id: { type: integer, example: 1 }
        stok: { type: integer, minimum: 0, example: 5 }
        sinopsis: { type: string, nullable: true, example: Panduan menulis kode bersih. }
    BukuPatch:
      type: object
      description: Semua atribut opsional, minimal satu atribut wajib dikirim.
      properties:
        isbn: { type: string }
        judul: { type: string, minLength: 5 }
        penulis: { type: string }
        penerbit: { type: string }
        tahun_terbit: { type: integer }
        kategori_id: { type: integer }
        stok: { type: integer, minimum: 0, example: 25 }
        sinopsis: { type: string, nullable: true }
    Peminjaman:
      type: object
      properties:
        id: { type: integer, example: 4 }
        kode_pinjam: { type: string, example: PJM-20261018-AB12C }
        nim_peminjam: { type: string, example: 12S24050 }
        nama_peminjam: { type: string, example: Olivia Tambunan }
        tanggal_pinjam: { type: string, format: date }
        tanggal_jatuh_tempo: { type: string, format: date }
        tanggal_kembali: { type: string, format: date, nullable: true }
        status: { type: string, enum: [dipinjam, dikembalikan] }
        buku:
          type: object
          properties:
            id: { type: integer }
            isbn: { type: string }
            judul: { type: string }
        _links:
          type: object
          description: Link kembalikan_buku hanya muncul bila status = dipinjam.
          additionalProperties: { $ref: '#/components/schemas/Link' }
    PeminjamanInput:
      type: object
      required: [buku_id, nim_peminjam, nama_peminjam]
      properties:
        buku_id: { type: integer, example: 22 }
        nim_peminjam: { type: string, minLength: 6, maxLength: 15, example: 12S24050 }
        nama_peminjam: { type: string, minLength: 3, maxLength: 150, example: Olivia Tambunan }
        durasi_hari: { type: integer, minimum: 1, maximum: 30, default: 7 }
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
        links:
          type: object
          properties:
            first: { type: string }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
            last: { type: string }
    ProblemDetails:
      type: object
      description: Galat berstandar IETF RFC 7807 (application/problem+json).
      properties:
        type: { type: string, example: "http://localhost:8000/docs/errors/validation-failed" }
        title: { type: string, example: Unprocessable Content }
        status: { type: integer, example: 422 }
        detail: { type: string }
        instance: { type: string, example: /api/v1/bukus }
        errors:
          type: object
          description: Rincian galat per kolom (khusus 422).
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    Unauthorized:
      description: Bearer Token tidak ada, salah, atau sudah dicabut
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource atau endpoint tidak ditemukan
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationFailed:
      description: Input tidak lolos validasi
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Permintaan berbenturan dengan state data saat ini
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Menerbitkan Stateless Bearer Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: pustakawan@del.ac.id }
                password: { type: string, example: password123 }
                device_name: { type: string, example: postman-client }
      responses:
        '200': { description: "Login berhasil, mengembalikan access_token" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pemilik token aktif
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: "Profil pengguna" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Mencabut (revoke) token yang sedang dipakai
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: "Token berhasil dicabut" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bukus:
    get:
      tags: [Buku]
      summary: Daftar buku terpaginasi (search, filter, sort)
      parameters:
        - { name: search, in: query, description: "Cari pada judul, penulis, atau ISBN", schema: { type: string } }
        - { name: kategori_id, in: query, schema: { type: integer } }
        - { name: tersedia, in: query, description: "1 = hanya buku dengan stok > 0", schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [judul, penulis, tahun_terbit, stok, created_at], default: judul } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
      responses:
        '200':
          description: Koleksi buku beserta blok meta paginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Buku' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Buku]
      summary: Menambah buku baru
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuInput' }
      responses:
        '201':
          description: Buku dibuat, header Location menunjuk /bukus/{id}
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /bukus/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Buku]
      summary: Detail buku beserta kategori dan riwayat peminjaman
      responses:
        '200':
          description: Detail ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Buku' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Buku]
      summary: Mengganti seluruh atribut buku (Full Replacement)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuInput' }
      responses:
        '200': { description: "Seluruh atribut diganti, sinopsis yang tidak dikirim direset ke null" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Buku]
      summary: Mengubah sebagian atribut buku (Partial Update)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuPatch' }
      responses:
        '200': { description: "Hanya atribut yang dikirim yang berubah" }
        '400':
          description: Payload PATCH kosong
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Buku]
      summary: Menghapus buku (ditolak 409 bila masih ada peminjaman aktif)
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: "Berhasil dihapus tanpa body" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bukus/{id}/referensi-eksternal:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Buku]
      summary: Metadata buku dari OpenLibrary (Laravel sebagai Service Consumer)
      responses:
        '200': { description: "Metadata eksternal berhasil diambil" }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Layanan eksternal mengembalikan galat
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '504':
          description: Layanan eksternal tidak terjangkau atau melewati batas waktu 8 detik
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /peminjamans:
    get:
      tags: [Peminjaman]
      summary: Daftar transaksi peminjaman terpaginasi
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [dipinjam, dikembalikan] } }
        - { name: nim, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
      responses:
        '200':
          description: Koleksi peminjaman beserta blok meta paginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Peminjaman' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Peminjaman]
      summary: Mencatat peminjaman (DB::transaction + lockForUpdate)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeminjamanInput' }
      responses:
        '201':
          description: Peminjaman dicatat, stok berkurang 1, header Location menunjuk /peminjamans/{id}
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Input tidak valid atau stok buku habis
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /peminjamans/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Peminjaman]
      summary: Detail satu transaksi peminjaman
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: "Detail ditemukan" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /peminjamans/{id}/kembalikan:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Peminjaman]
      summary: Mengembalikan buku (DB::transaction + lockForUpdate)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: "Status menjadi dikembalikan, stok bertambah 1" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
